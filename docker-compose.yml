services:
  postgres:
    image: postgres:16.0
    environment:
      POSTGRES_USER: local
      POSTGRES_PASSWORD: local
      POSTGRES_DB: shieldx
      PG_DATA: /var/lib/postgresql/data/pgdata
    volumes:
      - "./docker-volumes/postgres:/var/lib/postgresql/data"
    ports:
      - "5432:5432"
