services:
  postgres:
    image: postgres:16.0
    environment:
      POSTGRES_USER: local
      POSTGRES_PASSWORD: local
      POSTGRES_DB: shieldx
      PG_DATA: /var/lib/postgresql/data/pgdata
    volumes:
      - "./docker-volumes/postgres:/var/lib/postgresql/data"
    ports:
      - "5432:5432"
  shieldx:
    image: oracle-app
    environment:
      SHIELDX_R2DBC_URL: r2dbc:postgresql://postgres:5432/shieldx
      SHIELDX_R2DBC_USERNAME: local
      SHIELDX_R2DBC_PASSWORD: local
      SHIELDX_LIQUIBASE_URL: jdbc:postgresql://postgres:5432/shieldx
      SHIELDX_LIQUIBASE_PASSWORD: local
      SHIELDX_LIQUIBASE_USER: local