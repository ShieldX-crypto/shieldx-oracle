spring:
  application:
    name: oracle
  sql:
    init:
      mode: never
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
klever:
  api:
    base-url: ${KLEVER_API_BASE_URL:https://api.mainnet.klever.org}
    timeout: ${KLEVER_API_TIMEOUT:3000ms}
    page-size: ${KLEVER_API_PAGE_SIZE:50}